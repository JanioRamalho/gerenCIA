<svg xmlns="http://www.w3.org/2000/svg" width="640" height="578" viewBox="0 0 640 578" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Casos de uso do gerenCIA</title>
  <desc id="descricao">O visitante explora a demonstração, cria uma conta e entra. O usuário autenticado importa arquivos, consulta o histórico, analisa gastos, revisa transações, gerencia limites, consulta avisos e atualiza sua renda mensal.</desc>
