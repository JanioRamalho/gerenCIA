    </g>
    <g font-size="16" font-weight="bold">
      <text x="99" y="170">Visitante</text>
      <text x="99" y="439">Usuário autenticado</text>
    </g>
    <g font-size="16">
      <ellipse cx="436" cy="68" rx="161" ry="20" fill="white" stroke="#28665f" stroke-width="1.5"/>
